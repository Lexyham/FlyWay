<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Notifications - FlyWay</title><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/assets/css/responsive.css"></head>
<body>
<nav class="navbar" id="mainNav"><div class="nav-inner">
  <div style="display:flex;align-items:center;gap:10px;">
    <button class="hamburger" id="navHamburger" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <a href="/" class="nav-logo"><div class="nav-logo-icon">✈</div><span class="nav-logo-text">FLY<span style="color:var(--cyan)">WAY</span></span></a>
  </div>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/booking" class="nav-link">Book Flight</a>
    <a href="/track" class="nav-link">Track Flight</a>
    <a href="/flightmap" class="nav-link">3D Map</a>
    <a href="/flightgame" class="nav-link">Have Fun</a>
    <a href="/contact" class="nav-link">Contact</a>
    <a href="/dashboard" class="nav-link hidden" id="navDashBtn">My Account</a>
  </div>
  <div class="nav-actions"><button class="btn btn-ghost btn-sm" onclick="FlyWay.logout()">Sign Out</button></div>
</div></nav>
<div class="dashboard-layout">
<aside class="site-sidebar" id="sidebar">
  <div class="sidebar-nav-section"><div class="sidebar-nav-label">Main</div>
    <a href="/dashboard" class="sidebar-nav-item"><span class="nav-icon">🏠</span>Dashboard</a>
    <a href="/booking" class="sidebar-nav-item"><span class="nav-icon">✈</span>Book a Flight</a>
    <a href="/bookings" class="sidebar-nav-item"><span class="nav-icon">🗓</span>My Bookings</a>
  </div>
  <div class="sidebar-nav-section"><div class="sidebar-nav-label">Account</div>
    <a href="/transactions" class="sidebar-nav-item"><span class="nav-icon">💳</span>Transactions</a>
    <a href="/profile" class="sidebar-nav-item"><span class="nav-icon">👤</span>My Profile</a>
    <a href="/notifications" class="sidebar-nav-item active"><span class="nav-icon">🔔</span>Notifications</a>
    <a href="/track" class="sidebar-nav-item"><span class="nav-icon">📡</span>Track Flight</a>
  </div>
  <div class="sidebar-footer"><a href="/profile" class="user-chip"><div class="user-avatar" id="sidebarAvatar">U</div><div style="flex:1;min-width:0"><div class="user-name" id="sidebarName">Loading...</div><div class="user-sub" id="sidebarSub">-</div></div></a></div>
</aside>
<main class="dashboard-main">
  <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
    <div><h1 class="page-title-h">🔔 Notifications</h1><div class="page-subtitle">Messages from FlyWay and updates on your bookings</div></div>
    <button class="btn btn-ghost btn-sm" onclick="markAllRead()">✓ Mark all read</button>
  </div>
  <div id="notesList"><div class="empty-state"><div class="loading-spinner" style="margin:0 auto"></div></div></div>
</main></div>
<div id="toastContainer"></div>
<script src="/js/main.js"></script>
<script>
const typeIcons={welcome:'🎉',booking_confirmed:'✅',booking_cancelled:'❌',payment_pending:'⏳',payment_confirmed:'💳',proof_submitted:'📎',refund:'💰',message_reply:'💬',promo:'🎟',broadcast:'📢',admin:'👑',info:'ℹ',warning:'⚠',success:'✅'};
document.addEventListener('DOMContentLoaded',async()=>{
  if(!FlyWay.requireAuth())return;
  FlyWay.setupSidebar();
  await load();

  setInterval(load, 20000);
});
async function load(){
  try{
    const notes=await FlyWay.api('GET','/api/notifications');
    if(!notes.length){document.getElementById('notesList').innerHTML=`<div class="empty-state"><div class="empty-icon">🔔</div><div class="empty-title">No notifications yet</div><div class="empty-desc">Booking updates, admin messages, and promos will appear here.</div></div>`;return;}
    document.getElementById('notesList').innerHTML=notes.map(n=>`
      <div class="card mb-14" style="${!n.read?'border-color:rgba(0,212,255,0.25);background:rgba(0,212,255,0.02)':''}" onclick="markOne('${n.id}',this)">
        <div style="display:flex;align-items:flex-start;gap:14px">
          <div style="width:44px;height:44px;border-radius:12px;background:${!n.read?'linear-gradient(135deg,rgba(0,212,255,0.15),rgba(124,58,237,0.1))':'var(--navy3)'};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${typeIcons[n.type]||'🔔'}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px">
              <div style="font-weight:700;font-size:15px">${n.title}</div>
              <div style="display:flex;align-items:center;gap:8px">
                ${!n.read?'<span class="badge badge-cyan" style="font-size:10px">NEW</span>':''}
                <div style="font-size:11px;color:var(--muted)">${FlyWay.fmtDateTime(n.createdAt)}</div>
              </div>
            </div>
            <div style="font-size:13px;color:var(--muted);margin-top:5px;line-height:1.6;word-wrap:break-word;word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap">${n.message}</div>
          </div>
        </div>
      </div>`).join('');
  }catch(e){}
}
async function markOne(id,el){
  await FlyWay.api('PATCH',`/api/notifications/${id}/read`,{});
  el.style.borderColor='var(--border)';el.style.background='';
  el.querySelector('.badge.badge-cyan')?.remove();
}
async function markAllRead(){
  await FlyWay.api('PATCH','/api/notifications/read-all',{}).catch(()=> FlyWay.api('POST','/api/notifications/read-all',{}));
  FlyWay.toast('success','All marked as read');
  await load();
}


</script>
<script>
async function clearMyNotifications(){
  if(!confirm('Clear all your notifications?')) return;
  var tok=localStorage.getItem('fw_token');
  if(!tok) return;
  await fetch('/api/notifications/clear',{method:'DELETE',headers:{'Authorization':'Bearer '+tok}});
  location.reload();
}
</script>
<script src="/js/sidebar-toggle.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
  if (typeof io === 'undefined') return;
  var user = null;
  try { var s = localStorage.getItem('fw_user'); if(s) user = JSON.parse(s); } catch(e){}
  if (!user || !user.id) return;
  var socket = io();
  socket.on('connect', function(){ socket.emit('join_user', user.id); });
  socket.emit('join_user', user.id);
  socket.on('notification_' + user.id, function(){
    if (typeof load === 'function') load();
  });
})();
</script>

</body></html>
