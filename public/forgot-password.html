<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - FlyWay</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
<meta name="robots" content="noindex,nofollow">
  <meta name="copyright" content="FlyWay © 2025. All rights reserved. Unauthorized reproduction prohibited.">
  <meta http-equiv="Cache-Control" content="no-store">
</head>
<body>
<script>
(function(){
var _c=console,_l=_c.log,_w=_c.warn,_e=_c.error,_i=_c.info,_d=_c.debug;
function _b(){_l=_w=_e=_i=_d=function(){};}
try{Object.defineProperty(_c,'log',{get:function(){_b();return function(){};}});
Object.defineProperty(_c,'warn',{get:function(){_b();return function(){};}});
Object.defineProperty(_c,'error',{get:function(){_b();return function(){};}});}catch(e){}
var _dt=false;
var _thresh=160;
(function _chk(){
  var w=window.outerWidth-window.innerWidth;
  var h=window.outerHeight-window.innerHeight;
  if(w>_thresh||h>_thresh){
    if(!_dt){_dt=true;document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#020812;color:#e0f0ff;font-family:sans-serif;flex-direction:column;gap:20px"><div style="font-size:48px">🔒</div><div style="font-size:24px;font-weight:700">Access Restricted</div><div style="color:#4a6080;text-align:center;max-width:400px">Developer tools detected. This application is protected.</div></div>';}  
  } else { _dt=false; }
  setTimeout(_chk,800);
})();
document.addEventListener('keydown',function(e){
  if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['I','J','C','U'].includes(e.key))||(e.ctrlKey&&e.key==='U')){e.preventDefault();e.stopPropagation();return false;}
},true);
document.addEventListener('contextmenu',function(e){e.preventDefault();return false;});
(function _debug(){
  var s=new Date();var _=debugger;
  if(new Date()-s>100){document.location.reload();}
  setTimeout(_debug,3000);
})();
})();
</script>
<nav class="navbar"><div class="nav-inner">
  <a href="/" class="nav-logo"><div class="nav-logo-icon">✈</div><span class="nav-logo-text">FLY<span style="color:var(--cyan)">WAY</span></span></a>
</div></nav>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:90px 20px 40px;background:radial-gradient(ellipse at 30% 50%,rgba(0,212,255,0.06) 0%,transparent 60%),var(--navy);">
  <div style="width:100%;max-width:520px">
    <div class="card animate-in">
      <div class="text-center mb-28">
        <div style="font-size:40px;margin-bottom:8px">🔐</div>
        <h1 class="modal-title" style="font-size:26px">Reset Your Password</h1>
        <p style="color:var(--muted);font-size:14px;margin-top:6px">Enter your email to open the FlyWay secure gateway and safely reset your password.</p>
      </div>

      <div id="errBox" class="hidden" style="background:rgba(255,87,87,0.1);border:1px solid rgba(255,87,87,0.3);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--coral);margin-bottom:16px;"></div>
      <div id="successBox" class="hidden" style="background:rgba(0,227,150,0.1);border:1px solid rgba(0,227,150,0.3);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--emerald);margin-bottom:16px;"></div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-group"><span class="input-prefix">✉</span>
          <input class="form-input" type="email" id="email" placeholder="your@email.com" autocomplete="email">
        </div>
        <div id="emailStatus" style="margin-top:6px;font-size:12px;min-height:18px;"></div>
      </div>

      <div class="form-group" style="margin-top:16px;">
        <button class="btn btn-primary btn-full btn-lg" id="sendOtpBtn" onclick="sendPasswordOtp()">ENTER SECURE GATEWAY</button>
      </div>

      <div style="text-align:center;margin-top:20px;font-size:14px;color:var(--muted)">
        Remembered your password? <a href="/login" style="color:var(--cyan);font-weight:600">Sign In</a>
      </div>
    </div>

    <div style="text-align:center;margin-top:16px;font-size:12px;color:var(--muted);">
      🔒 Passwords are encrypted and stored securely.
    </div>
  </div>
</div>

<div id="toastContainer"></div>
<script src="/js/main.js"></script>
<script>
  function togglePw() {
    const pw = document.getElementById('newPassword');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  }

  function clearStatus() {
    document.getElementById('errBox').classList.add('hidden');
    document.getElementById('successBox').classList.add('hidden');
  }

  function setEmailStatus(type, msg) {
    const el = document.getElementById('emailStatus');
    if (!el) return;
    const colors = { checking: 'var(--muted)', ok: 'var(--emerald)', error: 'var(--coral)', warn: 'var(--gold)' };
    el.style.color = colors[type] || 'var(--muted)';
    el.textContent = msg;
  }

  async function sendPasswordOtp() {
    clearStatus();
    const statusEl = document.getElementById('emailStatus');
    if (statusEl) statusEl.textContent = '';
    const email = document.getElementById('email').value.trim();
    if (!email || !email.includes('@')) {
      const err = document.getElementById('errBox');
      err.textContent = 'Please enter a valid email address.';
      err.classList.remove('hidden');
      return;
    }
    const btn = document.getElementById('sendOtpBtn');
    FlyWay.setLoading(btn, true);

    // ── Stage 1–3: Email validation gate ───────────────────────────────────
    setEmailStatus('checking', '🔍 Verifying email address...');
    try {
      const check = await FlyWay.api('POST', '/api/auth/validate-email', { email });
      if (!check.valid) {
        const icon = check.disposable ? '⚠️' : '❌';
        setEmailStatus('error', `${icon} ${check.reason}`);
        const box = document.getElementById('errBox');
        box.textContent = check.disposable
          ? 'Disposable/temporary email addresses are not allowed.'
          : `Invalid email: ${check.reason}`;
        box.classList.remove('hidden');
        FlyWay.setLoading(btn, false);
        return;
      }
      setEmailStatus('ok', '✔️ Email verified');
    } catch {
      setEmailStatus('warn', '⚠️ Could not verify email — proceeding anyway');
    }

    // ── Stage 4: Check account exists + create reset session ───────────────
    try {
      const res = await FlyWay.api('POST', '/api/auth/request-reset-session', { email });
      FlyWay.toast('success', 'Gateway opening', 'Redirecting to the secure verification portal…');
      window.location.href = res.nextUrl;
    } catch (err) {
      const box = document.getElementById('errBox');
      const msg = err.message || '';
      if (msg.toLowerCase().includes('not found') || msg.toLowerCase().includes('email')) {
        box.textContent = '⚠️ No account found with that email address. Please check and try again.';
      } else {
        box.textContent = msg || 'Unable to start password reset. Please try again.';
      }
      box.classList.remove('hidden');
      FlyWay.setLoading(btn, false);
    }
  }

</script>
</body>
</html>
